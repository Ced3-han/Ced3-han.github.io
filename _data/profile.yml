short_bio: >-
  Hi, I am Jiahan Li (李嘉涵), also known as Ced. I am a CS Ph.D. student at <a href="https://cims.nyu.edu/dynamic/">NYU Courant</a>, advised by <a href="https://www.linkedin.com/in/rob-fergus-057808364/">Rob Fergus</a> and <a href="https://kyunghyuncho.me/">Kyunghyun Cho</a>.<br><br>
  
  Previously, I earned my B.S. degree from Yuanpei College at Peking University in 2023. I also spent three years at an <a href="https://www.earendil.bio/">AI-biotech startup</a>, where I worked with <a href="https://majianzhu.com/">Jianzhu Ma</a> and <a href="https://jianpeng.web.engr.illinois.edu/">Jian Peng</a>.<br><br>

  My research focuses on generative models for multimodal learning, world modeling, and AI for science, with a particular interest in incorporating scientific structure and prior knowledge.<br><br>

  Outside research, I'm a Hip-Hop producer and DJ. Some prod by me: <a href="https://www.bilibili.com/video/BV1fFC1BwEsL/?spm_id_from=333.337.search-card.all.click&amp;vd_source=8ba6457922f5c5309c67a7e905a420c8">PKU Cypher 2025</a>, <a href="https://www.bilibili.com/video/BV11w411G7th/?spm_id_from=333.337.search-card.all.click&amp;vd_source=8ba6457922f5c5309c67a7e905a420c8">PKU Cypher 2023</a>.<br><br>

