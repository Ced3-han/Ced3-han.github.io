{% assign publications = include.publications %}
<section class="featured-publications" aria-labelledby="selected-publications-heading">
    <div class="section-header">
        <div>
            <p class="eyebrow">Research</p>
            <h2 id="selected-publications-heading">{% if include.title %}{{ include.title }}{% else %}Selected Publications{% endif %}</h2>
        </div>
        <a class="text-link" href="{{ '/publications' | relative_url }}">
            View all <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </a>
    </div>

    <div class="publication-list">
        {% for item in publications limit:include.limit %}
            {% include widgets/publication_item.html item=item %}
        {% endfor %}
    </div>
</section>
